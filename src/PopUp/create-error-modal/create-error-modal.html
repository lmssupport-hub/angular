@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/40 p-4 backdrop-blur-sm">
    <div class="flex max-h-[95vh] w-full max-w-xl flex-col overflow-hidden rounded-2xl bg-white text-slate-900 shadow-2xl dark:bg-[#1a1a24] dark:text-slate-100">

      <!-- Header -->
      <div class="flex items-center justify-between border-b border-slate-100 px-5 py-2.5 dark:border-[#2a2a3a]">
        <div>
          <p class="text-[10px] font-semibold text-blue-600">Error list</p>
          <h2 class="text-base font-bold text-slate-900 dark:text-slate-100">Create Error</h2>
        </div>
        <button
          type="button"
          (click)="close()"
          class="grid h-7 w-7 place-items-center rounded-full text-slate-400 transition hover:bg-slate-100 hover:text-slate-700 dark:hover:bg-[#23233a] dark:hover:text-slate-200"
          aria-label="Close create error form"
        >
          ×
        </button>
      </div>

      <!-- Body -->
      <form [formGroup]="form" (ngSubmit)="submit()" class="flex-1 space-y-2.5 overflow-y-auto px-5 py-3">

        <div class="grid gap-3 sm:grid-cols-2">
          <label class="block">
            <span class="mb-1 block text-xs font-semibold text-slate-700 dark:text-slate-300">Project Name<span class="text-red-500">*</span></span>
            <select
              formControlName="projectId"
              (change)="onProjectChange()"
              class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs outline-none transition focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100 dark:border-[#2a2a3a] dark:bg-[#23233a] dark:text-slate-100 dark:focus:bg-[#15151f]"
            >
              <option [ngValue]="null">Select project</option>
              @for (p of projects; track p.id) {
                <option [ngValue]="p.id">{{ p.projectName }}</option>
              }
            </select>
            @if (form.get('projectId')?.touched && form.get('projectId')?.invalid) {
              <span class="mt-0.5 block text-[10px] text-red-500">Project is required</span>
            }
          </label>

          <label class="block">
            <span class="mb-1 block text-xs font-semibold text-slate-700 dark:text-slate-300">Task Name<span class="text-red-500">*</span></span>
            <select
              formControlName="taskId"
              (change)="onTaskChange()"
              class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs outline-none transition focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100 disabled:opacity-50 dark:border-[#2a2a3a] dark:bg-[#23233a] dark:text-slate-100 dark:focus:bg-[#15151f]"
            >
              <option [ngValue]="null">Select task</option>
              @for (t of tasks; track t.id) {
                <option [ngValue]="t.id">{{ t.taskName }}</option>
              }
            </select>
            @if (form.get('taskId')?.touched && form.get('taskId')?.invalid) {
              <span class="mt-0.5 block text-[10px] text-red-500">Task is required</span>
            }
          </label>
        </div>

        <!-- Field 10: Assign User — read-only, auto-populated from Task -->
        <label class="block">
          <span class="mb-1 block text-xs font-semibold text-slate-700 dark:text-slate-300">Assign User</span>
          <div class="flex h-8 w-full items-center rounded-xl border border-slate-200 bg-slate-100 px-3 text-xs text-slate-500 dark:border-[#2a2a3a] dark:bg-[#23233a]">
            {{ assignedUserName || 'Auto-populated from selected task' }}
          </div>
        </label>

        <label class="block">
          <span class="mb-1 block text-xs font-semibold text-slate-700 dark:text-slate-300">Page Title / Page No<span class="text-red-500">*</span></span>
          <input
            type="text"
            formControlName="pageTitle"
            placeholder="Page title or page number"
            class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs outline-none transition focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100 dark:border-[#2a2a3a] dark:bg-[#23233a] dark:text-slate-100 dark:focus:bg-[#15151f]"
          />
          @if (form.get('pageTitle')?.touched && form.get('pageTitle')?.invalid) {
            <span class="mt-0.5 block text-[10px] text-red-500">Page title/page no is required</span>
          }
        </label>

        <label class="block">
          <span class="mb-1 block text-xs font-semibold text-slate-700 dark:text-slate-300">Error Description<span class="text-red-500">*</span></span>
          <textarea
            formControlName="errorDescription"
            rows="2"
            maxlength="1000"
            placeholder="Describe the error"
            class="w-full resize-none rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs outline-none transition focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100 dark:border-[#2a2a3a] dark:bg-[#23233a] dark:text-slate-100 dark:focus:bg-[#15151f]"
          ></textarea>
          @if (form.get('errorDescription')?.touched && form.get('errorDescription')?.invalid) {
            <span class="mt-0.5 block text-[10px] text-red-500">Error description is required</span>
          }
        </label>

        <label class="block">
          <span class="mb-1 block text-xs font-semibold text-slate-700 dark:text-slate-300">Expected Result / Expected Behavior<span class="text-red-500">*</span></span>
          <textarea
            formControlName="expectedResult"
            rows="2"
            maxlength="1000"
            placeholder="Expected result or behavior"
            class="w-full resize-none rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs outline-none transition focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100 dark:border-[#2a2a3a] dark:bg-[#23233a] dark:text-slate-100 dark:focus:bg-[#15151f]"
          ></textarea>
          @if (form.get('expectedResult')?.touched && form.get('expectedResult')?.invalid) {
            <span class="mt-0.5 block text-[10px] text-red-500">Expected result is required</span>
          }
        </label>

        <div class="grid gap-3 sm:grid-cols-2">
          <label class="block">
            <span class="mb-1 block text-xs font-semibold text-slate-700 dark:text-slate-300">Priority<span class="text-red-500">*</span></span>
            <select
              formControlName="priority"
              class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs outline-none transition focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100 dark:border-[#2a2a3a] dark:bg-[#23233a] dark:text-slate-100 dark:focus:bg-[#15151f]"
            >
              <option value="" disabled>Select priority</option>
              @for (p of priorityOptions; track p) {
                <option [value]="p">{{ p }}</option>
              }
            </select>
            @if (form.get('priority')?.touched && form.get('priority')?.invalid) {
              <span class="mt-0.5 block text-[10px] text-red-500">Priority is required</span>
            }
          </label>

          <label class="block">
            <span class="mb-1 block text-xs font-semibold text-slate-700 dark:text-slate-300">Screenshot</span>
            <input
              type="file"
              accept=".jpg,.jpeg,.png"
              (change)="onScreenshotSelected($event)"
              class="w-full rounded-xl border border-slate-200 bg-slate-50 px-2 py-1.5 text-[11px] outline-none transition file:mr-2 file:rounded-full file:border-0 file:bg-blue-50 file:px-2.5 file:py-1 file:text-[10px] file:font-semibold file:text-blue-600 focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100 dark:border-[#2a2a3a] dark:bg-[#23233a] dark:text-slate-100"
            />
            @if (screenshotError) {
              <span class="mt-0.5 block text-[10px] text-red-500">{{ screenshotError }}</span>
            }
          </label>
        </div>

        <label class="block">
          <span class="mb-1 block text-xs font-semibold text-slate-700 dark:text-slate-300">Comments</span>
          <textarea
            formControlName="comments"
            rows="2"
            maxlength="500"
            placeholder="Additional comments (optional)"
            class="w-full resize-none rounded-xl border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs outline-none transition focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100 dark:border-[#2a2a3a] dark:bg-[#23233a] dark:text-slate-100 dark:focus:bg-[#15151f]"
          ></textarea>
        </label>

        <!-- Footer -->
        <div class="flex flex-col-reverse gap-3 border-t border-slate-100 pt-3 sm:flex-row sm:justify-end dark:border-[#2a2a3a]">
          <button
            type="button"
            (click)="close()"
            class="rounded-xl border border-slate-200 bg-white px-4 py-1.5 text-xs font-semibold text-slate-600 transition hover:bg-slate-50 dark:border-[#2a2a3a] dark:bg-[#23233a] dark:text-slate-300 dark:hover:bg-[#2a2a3a]"
          >
            Cancel
          </button>
          <button
            type="submit"
            [disabled]="submitting"
            class="rounded-xl bg-blue-600 px-4 py-1.5 text-xs font-semibold text-white shadow-sm transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-60"
          >
            {{ submitting ? 'Creating…' : 'Create Error' }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
