<div class="p-8 bg-[#f4f3f8] flex flex-col gap-4">

  <!-- TOP INPUT ROW: dropdown to load an existing package/role + name field -->
  <div class="grid grid-cols-[26%_74%] gap-4">
    <div class="relative w-full">
      <select
          [(ngModel)]="selectedExistingId"
          (change)="onExistingItemChange()"
          [disabled]="loadingItems()"
          class="appearance-none w-full bg-white rounded-full pl-5 pr-10 h-10 text-xs text-gray-500 shadow-sm outline-none focus:ring-2 focus:ring-[#5a4bb3]/30 disabled:opacity-60 disabled:cursor-not-allowed"
        >
          <option [ngValue]="null">{{ loadingItems() ? 'Loading...' : labels.dropdownPlaceholder }}</option>
          <option *ngFor="let item of availableItems" [ngValue]="item.id">{{ item.name }}</option>
        </select>
      <svg class="pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 h-3 w-3 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>

    <input
      type="text"
      [(ngModel)]="packageName"
      [placeholder]="labels.nameFieldPlaceholder"
      class="bg-white rounded-full px-5 h-10 text-xs text-gray-700 placeholder-gray-400 shadow-sm outline-none focus:ring-2 focus:ring-[#5a4bb3]/30"
    />
  </div>

  <!-- Admin-mode banner: shown only when no package has been assigned yet -->
  <div *ngIf="loadError" class="bg-white rounded-xl shadow-sm px-6 py-4 text-xs text-red-500">
    {{ loadError }}
  </div>

  <!-- LEFT + RIGHT cards -->
  <div class="grid grid-cols-[26%_74%] gap-4 items-stretch">

    <!-- LEFT: feature tree -->
    <div class="bg-white rounded-xl shadow-sm flex flex-col">
      <!-- Header: "Feature name", same h-14 as the right card's header, so both rows align -->
      <div class="h-14 flex items-center px-6 border-b border-gray-100 shrink-0">
        <span class="text-xs font-semibold text-gray-800">Feature name</span>
      </div>

      <div class="px-6 pt-6 pb-6 flex-1">
        <div *ngFor="let cat of filteredCategories" class="mb-6">
          <div
            class="h-10 flex items-center font-semibold text-xs"
            [ngClass]="isCategoryAllowed(cat.id) ? 'text-gray-800' : 'text-gray-300'"
          >
            {{ cat.name }}
          </div>
          <div
            *ngFor="let f of cat.features"
            class="h-12 flex items-center text-xs"
            [ngClass]="isCategoryAllowed(cat.id) ? 'text-gray-600' : 'text-gray-300'"
          >
            {{ f.name }}
          </div>
        </div>

        <!-- Admin mode, package assigned but it granted nothing -->
        <div *ngIf="!filteredCategories.length && !loadError" class="text-xs text-gray-400 text-center py-6">
          No features available
        </div>
      </div>

      <!-- Spacer to match the footer height on the right, so both cards end at the same bottom edge -->
      <div class="h-[73px] border-t border-gray-100 shrink-0"></div>
    </div>

    <!-- RIGHT: permission toggles -->
    <div class="bg-white rounded-xl shadow-sm flex flex-col">

      <!-- Permission column headers: fixed h-14, each label centered in its equal 25% column -->
      <div class="grid grid-cols-4 items-center h-14 px-6 border-b border-gray-100 justify-items-center">
        <span class="text-xs font-medium text-gray-500">Create</span>
        <span class="text-xs font-medium text-gray-500">Read</span>
        <span class="text-xs font-medium text-gray-500">Update</span>
        <span class="text-xs font-medium text-gray-500">Delete</span>
      </div>

      <!-- Toggle matrix -->
      <div class="px-6 pt-6 pb-4">
        <div *ngFor="let cat of filteredCategories" class="mb-6">

          <!-- Category master toggle row: same h-10 as the category label on the left -->
          <div class="h-10 grid grid-cols-4 items-center justify-items-center">
            <button
              type="button"
              (click)="toggleCategory(cat)"
              [disabled]="!isCategoryAllowed(cat.id)"
              class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors"
              [ngClass]="[
                cat.enabled ? 'bg-[#5a4bb3]' : 'bg-gray-200',
                isCategoryAllowed(cat.id) ? '' : 'opacity-30 cursor-not-allowed'
              ]"
            >
              <span
                class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform"
                [ngClass]="cat.enabled ? 'translate-x-6' : 'translate-x-1'"
              ></span>
            </button>
          </div>

          <!-- Feature rows: same h-12 as the feature name row on the left -->
          <div *ngFor="let f of cat.features" class="h-12 grid grid-cols-4 items-center justify-items-center">
            <button
              *ngFor="let key of permissionKeys"
              type="button"
              (click)="togglePermission(cat, f, key)"
              [disabled]="!isPermissionAllowed(cat.id, f.id, key)"
              class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors"
              [ngClass]="[
                f.permissions[key] ? 'bg-[#5a4bb3]' : 'bg-gray-200',
                isPermissionAllowed(cat.id, f.id, key) ? '' : 'opacity-30 cursor-not-allowed'
              ]"
            >
              <span
                class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform"
                [ngClass]="f.permissions[key] ? 'translate-x-6' : 'translate-x-1'"
              ></span>
            </button>
          </div>
        </div>
      </div>

      <!-- Footer actions -->
      <div class="flex items-center justify-end gap-4 px-6 py-4 border-t border-gray-100">
        <button
          (click)="cancel()"
          class="bg-white border border-gray-200 text-gray-500 px-6 h-10 rounded-full text-xs font-semibold hover:bg-gray-50"
        >
          Cancel
        </button>

        <!-- Editing an existing package/role: show Update -->
        <button
          *ngIf="selectedExistingId"
          (click)="savePackage()"
          [disabled]="saving"
          class="bg-white border border-gray-200 text-[#5a4bb3] px-6 h-10 rounded-full text-xs font-semibold hover:bg-gray-50 disabled:opacity-50"
        >
          {{ saving ? labels.updatingLabel : labels.updateButton }}
        </button>

        <!-- Creating a new package/role: show Save -->
        <button
          *ngIf="!selectedExistingId"
          (click)="savePackage()"
          [disabled]="saving"
          class="bg-white border border-gray-200 text-[#5a4bb3] px-6 h-10 rounded-full text-xs font-semibold hover:bg-gray-50 disabled:opacity-50"
        >
          {{ saving ? labels.savingLabel : labels.saveButton }}
        </button>
      </div>
    </div>
  </div>
</div>
